name: Deploy environments

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  STAGE: >-
    ${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || 'prod' }}

jobs:
  deploy:
    if: github.event.action != 'closed' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Verify
        run: bun run check

      # TEMPORARY: alchemy deploy is failing with a persistent "Unauthorized:
      # Authentication error" (Cloudflare code 10000). That error is normally a
      # transient flake, but it's now repeated identically across independent
      # runs, which points at the token itself rather than the client. This
      # step bypasses alchemy/wrangler entirely and asks Cloudflare directly
      # whether the token is valid, so we get its real diagnosis instead of
      # alchemy's generic retry-exhausted error. Remove once this is resolved.
      - name: Debug - verify Cloudflare token
        run: |
          curl -sS -o /tmp/cf-verify.json -w '%{http_code}\n' \
            -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json"
          cat /tmp/cf-verify.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy ${{ env.STAGE }}
        # --adopt lets the first prod run take ownership of the resources
        # previously created by Wrangler. It is harmless after state exists.
        run: bun alchemy deploy --stage "${{ env.STAGE }}" --yes ${{ env.STAGE == 'prod' && '--adopt' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Refuse production cleanup
        run: test "${{ env.STAGE }}" != prod

      - name: Destroy ${{ env.STAGE }}
        run: bun alchemy destroy --stage "${{ env.STAGE }}" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
